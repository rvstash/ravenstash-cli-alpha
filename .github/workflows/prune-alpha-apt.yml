name: prune-alpha-apt
run-name: Prune alpha APT below v0.12 · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE APT BELOW 0.12
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rvs-release
  cancel-in-progress: false

jobs:
  sign:
    if: inputs.confirmation == 'DELETE APT BELOW 0.12'
    runs-on: ubuntu-24.04
    environment: apt-signing
    steps:
      - name: Check out pruning policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev gnupg gpgv
      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Restore and authenticate public APT state
        run: |
          python3 packaging/repository/restore_public_apt.py \
            https://releases.ravenstash.com/rvs/apt \
            prior \
            packaging/repository/keys/ravenstash-rvs.gpg
      - name: Create the exact prune plan
        run: |
          cp -a prior pruned
          python3 packaging/repository/prune_apt_repository.py \
            pruned --minimum v0.12 --plan prune-plan.json
          test "$(jq -r '.retained_distributions | join(" ")' prune-plan.json)" = "v0.12 v0.13"
          test "$(jq -r '.removed_distributions | length' prune-plan.json)" -gt 0
      - name: Sign the retained channel manifest
        env:
          RVS_APT_GPG_PRIVATE_KEY: ${{ secrets.RVS_APT_GPG_PRIVATE_KEY }}
          RVS_APT_GPG_PASSPHRASE: ${{ secrets.RVS_APT_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/rvs-apt-signing"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$RVS_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test -n "$key_id"
          test "$key_id" = "$(tr -d '[:space:]' < packaging/repository/keys/fingerprint.txt)"
          passphrase_file="$RUNNER_TEMP/rvs-apt-passphrase"
          printf '%s' "$RVS_APT_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 0600 "$passphrase_file"
          gpg --batch --yes --local-user "$key_id" --digest-algo SHA512 \
            --pinentry-mode loopback --passphrase-file "$passphrase_file" \
            --output pruned/channels.json.gpg --detach-sign pruned/channels.json
          rm -f "$passphrase_file"
          rm -rf "$GNUPGHOME"
          python3 packaging/repository/verify_apt.py \
            pruned packaging/repository/keys/ravenstash-rvs.gpg
      - name: Upload bounded signed prune handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apt-prune-signed-${{ github.run_id }}
          path: |
            pruned/channels.json
            pruned/channels.json.gpg
            prune-plan.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    environment: apt-storage
    steps:
      - name: Check out pruning policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install publication verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version
      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Download signed prune handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: apt-prune-signed-${{ github.run_id }}
          path: handoff
      - name: Restore canonical storage state and recompute the plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          aws s3 sync \
            "s3://ravenstash-cli-releases/rvs/apt/" canonical/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          python3 packaging/repository/verify_apt.py \
            canonical packaging/repository/keys/ravenstash-rvs.gpg
          cp -a canonical pruned
          python3 packaging/repository/prune_apt_repository.py \
            pruned --minimum v0.12 --plan storage-plan.json
          cmp storage-plan.json handoff/prune-plan.json
          cp handoff/pruned/channels.json pruned/channels.json
          cp handoff/pruned/channels.json.gpg pruned/channels.json.gpg
          python3 packaging/repository/verify_apt.py \
            pruned packaging/repository/keys/ravenstash-rvs.gpg
      - name: Retain a one-day emergency backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apt-pre-v0.12-emergency-backup-${{ github.run_id }}
          path: canonical
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Publish the retained manifest and delete only planned objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="s3://ravenstash-cli-releases/rvs/apt"
          aws s3 cp handoff/pruned/channels.json "${destination}/channels.json" \
            --endpoint-url "$endpoint" --cache-control no-cache --only-show-errors
          aws s3 cp handoff/pruned/channels.json.gpg "${destination}/channels.json.gpg" \
            --endpoint-url "$endpoint" --cache-control no-cache --only-show-errors
          while IFS= read -r distribution; do
            [[ "$distribution" == "stable" || "$distribution" =~ ^v0\.([3-9]|10|11)$ ]]
            aws s3 rm "${destination}/dists/${distribution}/" \
              --recursive --endpoint-url "$endpoint" --only-show-errors
          done < <(jq -r '.removed_distributions[]' handoff/prune-plan.json)
          while IFS= read -r package; do
            [[ "$package" =~ ^pool/main/r/rvs/rvs_0\.([0-9]|10|11)\.[^/]+\.deb$ ]]
            aws s3 rm "${destination}/${package}" \
              --endpoint-url "$endpoint" --only-show-errors
          done < <(jq -r '.removed_packages[]' handoff/prune-plan.json)
      - name: Verify retained R2 and public repository state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="s3://ravenstash-cli-releases/rvs/apt"
          rm -rf retained
          aws s3 sync "${destination}/" retained/ \
            --endpoint-url "$endpoint" --no-progress
          python3 packaging/repository/verify_apt.py \
            retained packaging/repository/keys/ravenstash-rvs.gpg
          test "$(find retained/dists -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | xargs)" = "v0.12 v0.13"
          test "$(jq -r '.channels | keys | join(" ")' retained/channels.json)" = "v0.12 v0.13"
          for _ in 1 2 3 4 5; do
            rm -rf public-retained
            if python3 packaging/repository/restore_public_apt.py \
              https://releases.ravenstash.com/rvs/apt \
              public-retained \
              packaging/repository/keys/ravenstash-rvs.gpg; then
              exit 0
            fi
            sleep 5
          done
          exit 1
