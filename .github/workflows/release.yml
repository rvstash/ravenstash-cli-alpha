name: release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA from the dev branch
        type: string
        required: true
      version:
        description: Exact semantic version without v prefix
        type: string
        required: true
      channel:
        description: Exact compatibility channel (v0.Y before 1.0, vMAJOR afterwards)
        type: string
        required: true
      promote_channel:
        description: Make this channel the new-install default and deploy its installer
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: rvs-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release source and inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([~+.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/dev
          python3 packaging/repository/channel_policy.py validate "$VERSION" "$CHANNEL"
          project_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          test "$project_version" = "$VERSION"
          grep -Fx "readonly release_version=\"${VERSION}\"" packaging/install.sh
          grep -Fx "readonly compatibility_channel=\"${CHANNEL}\"" packaging/install.sh
          grep -Fx "\$ReleaseVersion = \"${VERSION}\"" packaging/install.ps1
          grep -Fx "\$CompatibilityChannel = \"${CHANNEL}\"" packaging/install.ps1
          test -z "$(git status --porcelain)"

      - name: Build and test in the pinned Ubuntu 20.04 environment
        run: packaging/scripts/build-in-ubuntu20.sh

      - name: Install and exercise on a clean Ubuntu 20.04 system
        run: |
          docker run --rm \
            --volume "$PWD/dist/release:/release:ro" \
            ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            /bin/bash -euc '
              apt-get update
              apt-get install --yes /release/rvs_*_amd64.deb
              rvs --version
              rvs --help >/dev/null
              ravenstash --version
              test -e /usr/lib/rvs/_internal/libpython3.14.so.1.0
            '

      - name: Record exact source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PROMOTE_CHANNEL: ${{ inputs.promote_channel }}
        run: |
          printf 'source_repository=%s\nsource_sha=%s\nversion=%s\nchannel=%s\npromote_channel=%s\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$VERSION" \
            "$CHANNEL" "$PROMOTE_CHANNEL" \
            > dist/release/source-identity.txt
          (
            cd dist/release
            sha256sum source-identity.txt >> "rvs-v${VERSION}-checksums.txt"
          )

      - name: Upload Linux amd64 build handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-platform-linux-amd64-${{ inputs.source_sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            build: packaging/scripts/build-in-ubuntu20.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: ${{ !startsWith(matrix.name, 'linux-') }}
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Resolve native build dependencies
        if: ${{ !startsWith(matrix.name, 'linux-') }}
        shell: bash
        run: uv sync --frozen --python 3.14 --group release
      - name: Build exact native target
        shell: bash
        run: ${{ matrix.build }}
      - name: Install and exercise the ARM64 Debian package
        run: |
          docker run --rm \
            --volume "$PWD/dist/release:/release:ro" \
            ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            /bin/bash -euc '
              apt-get update
              apt-get install --yes /release/rvs_*_arm64.deb
              test "$(dpkg --print-architecture)" = arm64
              rvs --version
              rvs --help >/dev/null
              ravenstash --version
              test -e /usr/lib/rvs/_internal/libpython3.14.so.1.0
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-platform-${{ matrix.name }}-${{ inputs.source_sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: macos-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Build and smoke-test native macOS bundle
        shell: bash
        run: |
          uv sync --frozen --python 3.14 --group release
          uv run python packaging/scripts/build_portable.py
          bundle="$(find build/release -mindepth 1 -maxdepth 1 -type d -name 'rvs-v*' -print -quit)"
          uv run python packaging/scripts/smoke_portable.py "$bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-platform-${{ matrix.name }}-${{ inputs.source_sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-2022
          - name: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Build and smoke-test native Windows bundle
        shell: pwsh
        run: |
          uv sync --frozen --python 3.14 --group release
          uv run python packaging/scripts/build_portable.py
          $bundle = Get-ChildItem build/release -Directory -Filter "rvs-v*" | Select-Object -First 1
          if (-not $bundle) { throw "Windows release bundle was not built" }
          uv run python packaging/scripts/smoke_portable.py $bundle.FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-platform-${{ matrix.name }}-${{ inputs.source_sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Build exact musl target
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            python@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc \
            /bin/sh -euc '
              apk add --no-cache binutils build-base libffi-dev
              pip install --no-cache-dir uv==0.11.24
              export UV_PROJECT_ENVIRONMENT=/tmp/rvs-musl-venv
              uv sync --frozen --python 3.14 --group release
              uv run pytest
              uv run python packaging/scripts/build_portable.py
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-platform-linux-musl-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  assemble:
    needs: [build, build-native, build-macos, build-windows, build-musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rvs-platform-*-${{ inputs.source_sha }}
          path: build
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Assemble and attest the complete native inventory
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PROMOTE_CHANNEL: ${{ inputs.promote_channel }}
        run: |
          rm -f build/rvs-v*-checksums.txt build/rvs-v*-checksums.sigstore.json build/source-identity.txt
          install -m 0755 packaging/install.sh build/install.sh
          install -m 0644 packaging/install.ps1 build/install.ps1
          python3 packaging/scripts/generate_package_manifests.py \
            build "$VERSION" "$GITHUB_REPOSITORY"
          printf 'source_repository=%s\nsource_sha=%s\nversion=%s\nchannel=%s\npromote_channel=%s\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$VERSION" "$CHANNEL" "$PROMOTE_CHANNEL" \
            > build/source-identity.txt
          (
            cd build
            find . -maxdepth 1 -type f ! -name '*-checksums.txt' ! -name '*.sigstore.json' \
              -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > "rvs-v${VERSION}-checksums.txt"
          )
          cosign sign-blob --yes \
            --bundle "build/rvs-v${VERSION}-checksums.sigstore.json" \
            "build/rvs-v${VERSION}-checksums.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-build-${{ inputs.source_sha }}
          path: build/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  restore:
    runs-on: ubuntu-24.04
    environment: apt-storage
    steps:
      - name: Check out release policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install restore verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version

      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh

      - name: Restore and authenticate previous APT state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          mkdir -p prior
          aws s3 sync \
            "s3://ravenstash-cli-releases/rvs/apt/" prior/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          python3 packaging/repository/verify_apt.py \
            prior packaging/repository/keys/ravenstash-rvs.gpg

      - name: Upload authenticated prior state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authenticated-prior-apt
          path: prior/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    needs:
      - assemble
      - restore
    runs-on: ubuntu-24.04
    environment: apt-signing
    permissions:
      contents: read
    steps:
      - name: Check out signing policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev gnupg gpgv

      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh

      - name: Download attested build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rvs-build-${{ inputs.source_sha }}
          path: build

      - name: Download authenticated prior state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: authenticated-prior-apt
          path: prior

      - name: Verify provenance and build inventory before exposing signer
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle "build/rvs-v${VERSION}-checksums.sigstore.json" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "build/rvs-v${VERSION}-checksums.txt"
          (
            cd build
            sha256sum --check --strict "rvs-v${VERSION}-checksums.txt"
          )
          grep -Fx "source_repository=${GITHUB_REPOSITORY}" build/source-identity.txt
          grep -Fx "source_sha=${SOURCE_SHA}" build/source-identity.txt
          test "$(find build -maxdepth 1 -type f -name "rvs_${VERSION}_amd64.deb" | wc -l)" = 1
          test "$(find build -maxdepth 1 -type f -name "rvs_${VERSION}_arm64.deb" | wc -l)" = 1
          python3 packaging/repository/verify_apt.py \
            prior packaging/repository/keys/ravenstash-rvs.gpg

      - name: Import key and sign the authenticated repository
        env:
          RVS_APT_GPG_PRIVATE_KEY: ${{ secrets.RVS_APT_GPG_PRIVATE_KEY }}
          RVS_APT_GPG_PASSPHRASE: ${{ secrets.RVS_APT_GPG_PASSPHRASE }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PROMOTE_CHANNEL: ${{ inputs.promote_channel }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/rvs-apt-signing"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$RVS_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test -n "$key_id"
          passphrase_file="$RUNNER_TEMP/rvs-apt-passphrase"
          printf '%s' "$RVS_APT_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 0600 "$passphrase_file"
          RVS_APT_GPG_KEY_ID="$key_id" \
          RVS_APT_GPG_FINGERPRINT="$(tr -d '[:space:]' < packaging/repository/keys/fingerprint.txt)" \
          RVS_APT_GPG_PASSPHRASE_FILE="$passphrase_file" \
          RVS_APT_CHANNEL="$CHANNEL" \
          RVS_APT_PROMOTE_CHANNEL=0 \
            packaging/repository/append_and_sign_apt.sh \
              prior \
              "build/rvs_${VERSION}_amd64.deb" \
              signed-amd64 \
              packaging/repository/keys/ravenstash-rvs.gpg
          RVS_APT_GPG_KEY_ID="$key_id" \
          RVS_APT_GPG_FINGERPRINT="$(tr -d '[:space:]' < packaging/repository/keys/fingerprint.txt)" \
          RVS_APT_GPG_PASSPHRASE_FILE="$passphrase_file" \
          RVS_APT_CHANNEL="$CHANNEL" \
          RVS_APT_PROMOTE_CHANNEL="$([[ "$PROMOTE_CHANNEL" == "true" ]] && printf 1 || printf 0)" \
            packaging/repository/append_and_sign_apt.sh \
              signed-amd64 \
              "build/rvs_${VERSION}_arm64.deb" \
              signed \
              packaging/repository/keys/ravenstash-rvs.gpg
          install -d -m 0755 portable
          install -m 0644 \
            "build/rvs-v${VERSION}-checksums.txt" \
            "portable/rvs-v${VERSION}-checksums.txt"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --local-user "$key_id" \
            --armor --detach-sign \
            --output "portable/rvs-v${VERSION}-checksums.txt.asc" \
            "portable/rvs-v${VERSION}-checksums.txt"
          gpgv \
            --keyring packaging/repository/keys/ravenstash-rvs.gpg \
            "portable/rvs-v${VERSION}-checksums.txt.asc" \
            "portable/rvs-v${VERSION}-checksums.txt"
          rm -f "$passphrase_file"
          rm -rf "$GNUPGHOME"

      - name: Upload signed handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-apt-${{ inputs.source_sha }}
          path: signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload signed portable inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-portable-${{ inputs.source_sha }}
          path: portable/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-apt:
    needs: sign
    runs-on: ubuntu-24.04
    environment: apt-storage
    permissions:
      contents: read
    steps:
      - name: Check out publication policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install publication verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version

      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh

      - name: Download signed handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-apt-${{ inputs.source_sha }}
          path: signed

      - name: Authenticate complete signed handoff before exposing storage key
        run: >-
          python3 packaging/repository/verify_apt.py
          signed packaging/repository/keys/ravenstash-rvs.gpg

      - name: Publish with InRelease last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          packaging/repository/publish_apt.sh \
            signed \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            ravenstash-cli-releases

      - name: Verify public repository and Ubuntu 20.04 installation
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          for _attempt in 1 2 3 4 5; do
            if curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              -fsS "https://releases.ravenstash.com/rvs/apt/dists/${CHANNEL}/InRelease" \
              -o public-InRelease; then
              break
            fi
            sleep 5
          done
          gpgv --keyring packaging/repository/keys/ravenstash-rvs.gpg public-InRelease
          docker run --rm \
            --env EXPECTED_VERSION \
            --env CHANNEL \
            --volume "$PWD/packaging/repository/keys/ravenstash-rvs.gpg:/usr/share/keyrings/ravenstash-rvs.gpg:ro" \
            ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            /bin/bash -euc '
              apt-get update
              apt-get install --yes ca-certificates
              printf "%s\n" \
                "deb [arch=amd64 signed-by=/usr/share/keyrings/ravenstash-rvs.gpg] https://releases.ravenstash.com/rvs/apt ${CHANNEL} main" \
                > /etc/apt/sources.list.d/ravenstash-rvs.list
              apt-get update
              apt-get install --yes rvs
              test "$(dpkg-query -W -f="\${Version}" rvs)" = "$EXPECTED_VERSION"
              rvs --version
            '

  verify-apt-arm64:
    needs: publish-apt
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out repository trust policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify public ARM64 package installation
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          docker run --rm \
            --env EXPECTED_VERSION \
            --env CHANNEL \
            --volume "$PWD/packaging/repository/keys/ravenstash-rvs.gpg:/usr/share/keyrings/ravenstash-rvs.gpg:ro" \
            ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            /bin/bash -euc '
              apt-get update
              apt-get install --yes ca-certificates
              printf "%s\n" \
                "deb [arch=arm64 signed-by=/usr/share/keyrings/ravenstash-rvs.gpg] https://releases.ravenstash.com/rvs/apt ${CHANNEL} main" \
                > /etc/apt/sources.list.d/ravenstash-rvs.list
              apt-get update
              apt-get install --yes rvs
              test "$(dpkg --print-architecture)" = arm64
              test "$(dpkg-query -W -f="\${Version}" rvs)" = "$EXPECTED_VERSION"
              rvs --version
            '

  deploy-installer:
    needs:
      - assemble
      - publish-apt
      - verify-apt-arm64
      - publish-github-release
    runs-on: ubuntu-24.04
    environment: installer-delivery
    permissions:
      contents: read
    steps:
      - name: Check out installer delivery policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rvs-build-${{ inputs.source_sha }}
          path: release-build

      - name: Authenticate the exact installer before exposing deploy credentials
        env:
          VERSION: ${{ inputs.version }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle "release-build/rvs-v${VERSION}-checksums.sigstore.json" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "release-build/rvs-v${VERSION}-checksums.txt"
          (
            cd release-build
            sha256sum --check --strict "rvs-v${VERSION}-checksums.txt"
          )
          bash -n release-build/install.sh
          install -m 0644 release-build/install.sh packaging/installer-worker/src/install.sh
          install -m 0644 release-build/install.ps1 packaging/installer-worker/src/install.ps1

      - name: Install and validate the dedicated installer Worker
        working-directory: packaging/installer-worker
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run check

      - name: Deploy the validated installer Worker
        if: inputs.promote_channel
        working-directory: packaging/installer-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Verify exact live bytes and security headers
        if: inputs.promote_channel
        env:
          EXPECTED_INSTALLER: release-build/install.sh
          EXPECTED_WINDOWS_INSTALLER: release-build/install.ps1
        run: |
          for attempt in {1..60}; do
            if curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --max-redirs 0 -fsS \
                --dump-header installer-headers.txt \
                https://ravenstash.com/install.sh \
                --output live-install.sh \
              && cmp "$EXPECTED_INSTALLER" live-install.sh \
              && bash -n live-install.sh \
              && grep -Eiq '^content-type: text/plain([;[:space:]]|$)' installer-headers.txt \
              && grep -Eiq '^cache-control: no-store' installer-headers.txt \
              && grep -Eiq '^strict-transport-security: max-age=31536000; includeSubDomains' installer-headers.txt \
              && grep -Eiq '^x-content-type-options: nosniff' installer-headers.txt; then
              if curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
                  --max-redirs 0 -fsS \
                  --dump-header windows-installer-headers.txt \
                  https://ravenstash.com/install.ps1 \
                  --output live-install.ps1 \
                && cmp "$EXPECTED_WINDOWS_INSTALLER" live-install.ps1 \
                && grep -Eiq '^content-type: text/plain([;[:space:]]|$)' windows-installer-headers.txt \
                && grep -Eiq '^cache-control: no-store' windows-installer-headers.txt; then
                exit 0
              fi
            fi
            if [[ "$attempt" -lt 60 ]]; then
              sleep 5
            fi
          done
          echo "::error::Live installer did not converge to the deployed bytes and headers"
          exit 1

      - name: Keep the current installer for a maintenance-only channel release
        if: ${{ !inputs.promote_channel }}
        run: echo "Compatibility channel published without changing the new-install default."

  publish-github-release:
    needs:
      - assemble
      - publish-apt
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Download attested build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rvs-build-${{ inputs.source_sha }}
          path: build

      - name: Download signed portable inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-portable-${{ inputs.source_sha }}
          path: build

      - name: Create immutable-source draft, upload once, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --draft \
            --title "$tag" \
            --notes "Ravenstash CLI alpha ${tag} on ${CHANNEL}; exact source ${GITHUB_REPOSITORY}@${SOURCE_SHA}." \
            build/*
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  cleanup-artifacts:
    if: ${{ always() }}
    needs:
      - build
      - build-native
      - build-macos
      - build-windows
      - build-musl
      - assemble
      - restore
      - sign
      - publish-apt
      - verify-apt-arm64
      - deploy-installer
      - publish-github-release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete temporary handoff artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
