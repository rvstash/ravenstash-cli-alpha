name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Sync project
        run: uv sync --locked

      - name: Install build tools
        run: |
          uv pip install "pyinstaller>=6,<7"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify
        run: |
          .venv/bin/pytest
          .venv/bin/ruff check rvs tests
          .venv/bin/pyright

      - name: Build release artifacts
        run: packaging/scripts/build-release-artifacts.sh

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvs-linux-amd64
          path: dist/release/*
          if-no-files-found: error

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-linux-amd64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: rvs-linux-amd64
          path: dist/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "rvs $GITHUB_REF_NAME" \
          || gh release upload "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-apt:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-linux-amd64
    runs-on: ubuntu-22.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_APT_BUCKET }}
      RVS_APT_GPG_PRIVATE_KEY: ${{ secrets.RVS_APT_GPG_PRIVATE_KEY }}
      RVS_APT_GPG_PASSPHRASE: ${{ secrets.RVS_APT_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: rvs-linux-amd64
          path: dist/release

      - name: Install APT publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils awscli gnupg

      - name: Validate release configuration
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          test -n "$RVS_APT_GPG_PRIVATE_KEY"

      - name: Restore existing APT repository
        run: |
          mkdir -p dist/apt
          aws s3 sync "s3://${R2_BUCKET}/rvs/apt/" dist/apt/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress

      - name: Sign APT repository
        run: |
          export GNUPGHOME="$RUNNER_TEMP/rvs-apt-gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          printf '%s' "$RVS_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$key_id"

          passphrase_file="$RUNNER_TEMP/rvs-apt-gpg-passphrase"
          printf '%s' "$RVS_APT_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 0600 "$passphrase_file"

          mkdir -p dist/packages
          cp dist/release/rvs_*_amd64.deb dist/packages/
          RVS_APT_GPG_KEY_ID="$key_id" \
            RVS_APT_GPG_PASSPHRASE_FILE="$passphrase_file" \
            packaging/scripts/update-apt-repo.sh

      - name: Publish APT repository
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="s3://${R2_BUCKET}/rvs/apt"

          aws s3 sync dist/apt/pool/ "${destination}/pool/" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress
          aws s3 cp dist/apt/ravenstash-rvs.gpg \
            "${destination}/ravenstash-rvs.gpg" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=3600" \
            --no-progress
          aws s3 sync dist/apt/dists/ "${destination}/dists/" \
            --endpoint-url "$endpoint" \
            --cache-control "no-cache" \
            --delete \
            --no-progress
