name: release
run-name: ${{ inputs.kind == 'candidate' && 'Candidate' || 'Release' }} rvs v${{ inputs.version }} · ${{ inputs.source_branch }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit from the selected protected branch
        type: string
        required: true
      source_branch:
        description: Protected source branch (main or release/vMAJOR.MINOR)
        type: string
        required: true
        default: main
      version:
        description: Stable X.Y.Z or candidate X.Y.ZrcN version, without v prefix
        type: string
        required: true
      kind:
        description: Publish a stable release or a signed GitHub prerelease candidate
        type: choice
        options:
          - candidate
          - stable
        required: true
      channel:
        description: Exact vMAJOR.MINOR compatibility series
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rvs-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source, version, channel, and release slot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          KIND: ${{ inputs.kind }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" =~ ^(main|release/v[0-9]+\.[0-9]+)$ ]]
          if [[ "$KIND" == stable ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            test "$KIND" = candidate
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[1-9][0-9]*$ ]]
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/${SOURCE_BRANCH}"
          python3 packaging/repository/channel_policy.py validate "$VERSION" "$CHANNEL"
          if [[ "$SOURCE_BRANCH" == release/* ]]; then
            test "$SOURCE_BRANCH" = "release/${CHANNEL}"
          fi
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)" = "$VERSION"
          grep -Fx "readonly release_version=\"${VERSION}\"" packaging/install.sh
          grep -Fx "readonly compatibility_channel=\"${CHANNEL}\"" packaging/install.sh
          grep -Fx "\$ReleaseVersion = \"${VERSION}\"" packaging/install.ps1
          grep -Fx "\$CompatibilityChannel = \"${CHANNEL}\"" packaging/install.ps1
          packaging/scripts/assert-github-release-slot-empty.sh \
            "$GITHUB_REPOSITORY" "v${VERSION}"
      - name: Require successful checks for the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          workflows=(
            ci.yml
            platform-certification.yml
          )
          {
            echo "## Required release gates"
            echo
            for workflow in "${workflows[@]}"; do
              run_id="$(
                gh api \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${SOURCE_SHA}&per_page=100" \
                  --jq '.workflow_runs | map(select(.conclusion == "success")) | first | .id // empty'
              )"
              test -n "$run_id"
              echo "- \`${workflow}\`: run [\`${run_id}\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  linux-glibc-amd64:
    name: Build · Linux glibc · amd64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-glibc-amd64
      runner: ubuntu-24.04
      kind: glibc
      architecture: amd64
      include_metadata: true
      artifact_paths: |
        dist/release/rvs_${{ inputs.version }}_amd64.deb
        dist/release/rvs-v${{ inputs.version }}-linux-amd64.tar.gz

  linux-glibc-arm64:
    name: Build · Linux glibc · arm64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-glibc-arm64
      runner: ubuntu-24.04-arm
      kind: glibc
      architecture: arm64
      artifact_paths: |
        dist/release/rvs_${{ inputs.version }}_arm64.deb
        dist/release/rvs-v${{ inputs.version }}-linux-arm64.tar.gz

  linux-musl-amd64:
    name: Build · Linux musl · amd64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-musl-amd64
      runner: ubuntu-24.04
      kind: musl
      architecture: amd64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-linux-musl-amd64.tar.gz

  linux-musl-arm64:
    name: Build · Linux musl · arm64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-musl-arm64
      runner: ubuntu-24.04-arm
      kind: musl
      architecture: arm64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-linux-musl-arm64.tar.gz

  macos-arm64:
    name: Build · macOS · Apple Silicon
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: macos-arm64
      runner: macos-14
      kind: portable
      architecture: arm64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-macos-arm64.tar.gz

  macos-amd64:
    name: Build · macOS · Intel
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: macos-amd64
      runner: macos-15-intel
      kind: portable
      architecture: amd64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-macos-amd64.tar.gz

  windows-amd64:
    name: Build · Windows · x64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: windows-amd64
      runner: windows-2022
      kind: portable
      architecture: amd64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-windows-amd64.zip

  windows-arm64:
    name: Build · Windows · ARM64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: windows-arm64
      runner: windows-11-arm
      kind: portable
      architecture: arm64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-windows-arm64.zip

  assemble:
    name: Assemble and attest release
    needs:
      - linux-glibc-amd64
      - linux-glibc-arm64
      - linux-musl-amd64
      - linux-musl-arm64
      - macos-arm64
      - macos-amd64
      - windows-amd64
      - windows-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download isolated target handoffs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rvs-target-*-${{ inputs.source_sha }}
          path: build/targets
      - name: Install pinned Sigstore signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Assemble a collision-free release inventory
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          KIND: ${{ inputs.kind }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          install -d build/release
          expected=(
            "rvs_${VERSION}_amd64.deb"
            "rvs_${VERSION}_arm64.deb"
            "rvs-v${VERSION}-linux-amd64.tar.gz"
            "rvs-v${VERSION}-linux-arm64.tar.gz"
            "rvs-v${VERSION}-linux-musl-amd64.tar.gz"
            "rvs-v${VERSION}-linux-musl-arm64.tar.gz"
            "rvs-v${VERSION}-macos-amd64.tar.gz"
            "rvs-v${VERSION}-macos-arm64.tar.gz"
            "rvs-v${VERSION}-windows-amd64.zip"
            "rvs-v${VERSION}-windows-arm64.zip"
            "rvs-v${VERSION}-sbom.cdx.json"
          )
          for filename in "${expected[@]}"; do
            mapfile -t matches < <(find build/targets -type f -name "$filename" -print)
            test "${#matches[@]}" = 1
            install -m 0644 "${matches[0]}" "build/release/$filename"
          done
          install -m 0755 packaging/install.sh build/release/install.sh
          install -m 0644 packaging/install.ps1 build/release/install.ps1
          python3 packaging/scripts/generate_package_manifests.py \
            build/release "$VERSION" "$GITHUB_REPOSITORY"
          printf '%s\n' \
            "source_repository=${GITHUB_REPOSITORY}" \
            "source_sha=${SOURCE_SHA}" \
            "version=${VERSION}" \
            "channel=${CHANNEL}" \
            "release_kind=${KIND}" \
            "source_branch=${SOURCE_BRANCH}" \
            "release_run_id=${GITHUB_RUN_ID}" \
            "release_workflow=.github/workflows/release.yml" \
            > build/release/source-identity.txt
          (
            cd build/release
            find . -maxdepth 1 -type f ! -name '*-checksums.txt' ! -name '*.sigstore.json' \
              -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > "rvs-v${VERSION}-checksums.txt"
          )
          cosign sign-blob --yes \
            --bundle "build/release/rvs-v${VERSION}-checksums.sigstore.json" \
            "build/release/rvs-v${VERSION}-checksums.txt"
      - name: Summarize immutable release inventory
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Release inventory"
            echo
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Source: \`${{ inputs.source_sha }}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Channel: \`${{ inputs.channel }}\`"
            echo "- Kind: \`${{ inputs.kind }}\`"
            echo "- Source branch: \`${{ inputs.source_branch }}\`"
            echo
            echo '```text'
            sed 's/^/  /' "build/release/rvs-v${VERSION}-checksums.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable release inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-release-${{ inputs.source_sha }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  restore-apt:
    name: Restore authenticated APT state
    needs: validate
    if: inputs.kind == 'stable'
    runs-on: ubuntu-24.04
    environment: apt-storage
    steps:
      - name: Check out publication policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install restore verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version
      - name: Materialize pinned trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Restore and authenticate canonical APT state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          mkdir -p prior
          aws s3 sync \
            "s3://ravenstash-cli-releases/rvs/apt/" prior/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          python3 packaging/repository/recover_missing_apt_indexes.py \
            prior packaging/repository/keys/ravenstash-rvs.gpg
          python3 packaging/repository/verify_apt.py \
            prior packaging/repository/keys/ravenstash-rvs.gpg
      - name: Upload authenticated prior state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authenticated-prior-apt-${{ github.run_id }}
          path: prior/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    name: Sign release inventory${{ inputs.kind == 'stable' && ' and APT state' || '' }}
    needs:
      - assemble
      - restore-apt
    if: ${{ always() && needs.assemble.result == 'success' && (inputs.kind == 'candidate' || needs.restore-apt.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: apt-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out signing policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev gnupg gpgv
      - name: Materialize pinned trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Download immutable release inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rvs-release-${{ inputs.source_sha }}
          path: build
      - name: Download authenticated prior state
        if: inputs.kind == 'stable'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: authenticated-prior-apt-${{ github.run_id }}
          path: prior
      - name: Authenticate release inventory and prior state before exposing signer
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
          KIND: ${{ inputs.kind }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
        run: |
          cosign verify-blob \
            --bundle "build/rvs-v${VERSION}-checksums.sigstore.json" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "build/rvs-v${VERSION}-checksums.txt"
          (
            cd build
            sha256sum --check --strict "rvs-v${VERSION}-checksums.txt"
          )
          grep -Fx "source_repository=${GITHUB_REPOSITORY}" build/source-identity.txt
          grep -Fx "source_sha=${SOURCE_SHA}" build/source-identity.txt
          grep -Fx "version=${VERSION}" build/source-identity.txt
          grep -Fx "channel=${CHANNEL}" build/source-identity.txt
          grep -Fx "release_kind=${KIND}" build/source-identity.txt
          grep -Fx "source_branch=${SOURCE_BRANCH}" build/source-identity.txt
          grep -Fx "release_run_id=${RELEASE_RUN_ID}" build/source-identity.txt
          grep -Fx "release_workflow=.github/workflows/release.yml" \
            build/source-identity.txt
          test "$(find build -maxdepth 1 -type f -name "rvs_${VERSION}_amd64.deb" | wc -l)" = 1
          test "$(find build -maxdepth 1 -type f -name "rvs_${VERSION}_arm64.deb" | wc -l)" = 1
          if [[ "$KIND" == stable ]]; then
            python3 packaging/repository/verify_apt.py \
              prior packaging/repository/keys/ravenstash-rvs.gpg
          fi
      - name: Sign portable inventory and stable APT state
        env:
          RVS_APT_GPG_PRIVATE_KEY: ${{ secrets.RVS_APT_GPG_PRIVATE_KEY }}
          RVS_APT_GPG_PASSPHRASE: ${{ secrets.RVS_APT_GPG_PASSPHRASE }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          KIND: ${{ inputs.kind }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/rvs-apt-signing"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$RVS_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test -n "$key_id"
          passphrase_file="$RUNNER_TEMP/rvs-apt-passphrase"
          printf '%s' "$RVS_APT_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 0600 "$passphrase_file"
          if [[ "$KIND" == stable ]]; then
            RVS_APT_GPG_KEY_ID="$key_id" \
            RVS_APT_GPG_FINGERPRINT="$(tr -d '[:space:]' < packaging/repository/keys/fingerprint.txt)" \
            RVS_APT_GPG_PASSPHRASE_FILE="$passphrase_file" \
            RVS_APT_CHANNEL="$CHANNEL" \
              packaging/repository/append_and_sign_apt.sh \
                prior signed packaging/repository/keys/ravenstash-rvs.gpg \
                "build/rvs_${VERSION}_amd64.deb" \
                "build/rvs_${VERSION}_arm64.deb"
          fi
          install -d -m 0755 portable
          install -m 0644 \
            "build/rvs-v${VERSION}-checksums.txt" \
            "portable/rvs-v${VERSION}-checksums.txt"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --local-user "$key_id" \
            --armor --detach-sign \
            --output "portable/rvs-v${VERSION}-checksums.txt.asc" \
            "portable/rvs-v${VERSION}-checksums.txt"
          gpgv \
            --keyring packaging/repository/keys/ravenstash-rvs.gpg \
            "portable/rvs-v${VERSION}-checksums.txt.asc" \
            "portable/rvs-v${VERSION}-checksums.txt"
          rm -f "$passphrase_file"
          rm -rf "$GNUPGHOME"
      - name: Upload signed APT handoff
        if: inputs.kind == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-apt-${{ github.run_id }}
          path: signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload signed portable inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-portable-${{ github.run_id }}
          path: portable/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-apt:
    name: Publish signed APT state
    needs: sign
    if: inputs.kind == 'stable'
    runs-on: ubuntu-24.04
    environment: apt-storage
    permissions:
      contents: read
    steps:
      - name: Check out publication policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install publication verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version
      - name: Materialize pinned trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Download signed APT handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-apt-${{ github.run_id }}
          path: signed
      - name: Authenticate complete handoff before exposing storage key
        run: >-
          python3 packaging/repository/verify_apt.py
          signed packaging/repository/keys/ravenstash-rvs.gpg
      - name: Publish ordered batched phases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          packaging/repository/publish_apt.sh \
            signed \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            ravenstash-cli-releases

  verify-apt:
    name: Verify APT · ${{ matrix.architecture }}
    needs: publish-apt
    if: inputs.kind == 'stable'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out repository trust policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Materialize pinned trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Verify public package installation
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker run --rm \
            --env EXPECTED_VERSION \
            --env CHANNEL \
            --env ARCHITECTURE \
            --volume "$PWD/packaging/repository/keys/ravenstash-rvs.gpg:/usr/share/keyrings/ravenstash-rvs.gpg:ro" \
            ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            /bin/bash -euc '
              sed -i \
                -e "s|http://archive.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g" \
                -e "s|http://security.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g" \
                /etc/apt/sources.list
              apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
              apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install --yes ca-certificates
              printf "%s\n" \
                "deb [arch=${ARCHITECTURE} signed-by=/usr/share/keyrings/ravenstash-rvs.gpg] https://releases.ravenstash.com/rvs/apt ${CHANNEL} main" \
                > /etc/apt/sources.list.d/ravenstash-rvs.list
              apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=20 update
              apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=20 install --yes rvs
              test "$(dpkg --print-architecture)" = "$ARCHITECTURE"
              test "$(dpkg-query -W -f="\${Version}" rvs)" = "$EXPECTED_VERSION"
              rvs --version
            '

  publish-github-release:
    name: Publish immutable GitHub ${{ inputs.kind == 'candidate' && 'prerelease' || 'release' }}
    needs:
      - sign
      - verify-apt
    if: ${{ always() && needs.sign.result == 'success' && (inputs.kind == 'candidate' || needs.verify-apt.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download immutable release inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rvs-release-${{ inputs.source_sha }}
          path: build
      - name: Download signed portable inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-portable-${{ github.run_id }}
          path: build
      - name: Create immutable-source draft, upload once, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          KIND: ${{ inputs.kind }}
        run: |
          tag="v${VERSION}"
          packaging/scripts/assert-github-release-slot-empty.sh \
            "$GITHUB_REPOSITORY" "$tag"
          prerelease=()
          if [[ "$KIND" == candidate ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --draft \
            "${prerelease[@]}" \
            --title "$tag" \
            --notes "Ravenstash CLI ${KIND} ${tag} on ${CHANNEL}; exact source ${GITHUB_REPOSITORY}@${SOURCE_SHA}." \
            build/*
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  cleanup-artifacts:
    name: Remove successful release handoffs
    needs: publish-github-release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete current-run handoffs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' \
            | while read -r artifact_id; do
                gh api --method DELETE \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
