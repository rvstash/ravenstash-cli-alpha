name: promote-installer

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit of the published release
        type: string
        required: true
      version:
        description: Exact published semantic version without v prefix
        type: string
        required: true
      channel:
        description: Exact compatibility channel of the published release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rvs-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: installer-delivery
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Download the immutable published release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([~+.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/dev
          python3 packaging/repository/channel_policy.py validate "$VERSION" "$CHANNEL"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)" = "$VERSION"
          grep -Fx "readonly release_version=\"${VERSION}\"" packaging/install.sh
          grep -Fx "readonly compatibility_channel=\"${CHANNEL}\"" packaging/install.sh

          tag="v${VERSION}"
          test "$(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq .targetCommitish
          )" = "$SOURCE_SHA"
          test "$(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft
          )" = false
          test "$(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq .isPrerelease
          )" = false

          mkdir release-build
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-build

      - name: Authenticate the exact published installer
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/dev
        run: |
          printf '%s\n' \
            install.sh \
            "rvs-v${VERSION}-checksums.sigstore.json" \
            "rvs-v${VERSION}-checksums.txt" \
            "rvs-v${VERSION}-checksums.txt.asc" \
            "rvs-v${VERSION}-linux-amd64.tar.gz" \
            "rvs-v${VERSION}-sbom.cdx.json" \
            "rvs_${VERSION}_amd64.deb" \
            source-identity.txt \
            | sort > expected-assets.txt
          find release-build -maxdepth 1 -type f -printf '%f\n' \
            | sort > actual-assets.txt
          cmp expected-assets.txt actual-assets.txt

          cosign verify-blob \
            --bundle "release-build/rvs-v${VERSION}-checksums.sigstore.json" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "release-build/rvs-v${VERSION}-checksums.txt"
          gpgv \
            --keyring packaging/repository/keys/ravenstash-rvs.gpg \
            "release-build/rvs-v${VERSION}-checksums.txt.asc" \
            "release-build/rvs-v${VERSION}-checksums.txt"
          (
            cd release-build
            sha256sum --check --strict "rvs-v${VERSION}-checksums.txt"
          )
          grep -Fx "source_repository=${GITHUB_REPOSITORY}" \
            release-build/source-identity.txt
          grep -Fx "source_sha=${SOURCE_SHA}" release-build/source-identity.txt
          grep -Fx "version=${VERSION}" release-build/source-identity.txt
          grep -Fx "channel=${CHANNEL}" release-build/source-identity.txt
          grep -Eq '^promote_channel=(true|false)$' \
            release-build/source-identity.txt
          cmp packaging/install.sh release-build/install.sh
          bash -n release-build/install.sh

      - name: Refuse an installer rollback
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-redirs 0 -fsS \
            https://ravenstash.com/install.sh \
            --output current-install.sh
          bash -n current-install.sh
          current_version="$(
            sed -n 's/^readonly release_version="\([^"]*\)"/\1/p' \
              current-install.sh
          )"
          test -n "$current_version"
          dpkg --compare-versions "$VERSION" ge "$current_version"

      - name: Install and validate the dedicated installer Worker
        run: |
          install -m 0644 release-build/install.sh \
            packaging/installer-worker/src/install.sh
          cd packaging/installer-worker
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run check

      - name: Deploy the validated installer Worker
        working-directory: packaging/installer-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Verify exact live bytes and security headers
        env:
          EXPECTED_INSTALLER: release-build/install.sh
        run: |
          for attempt in {1..60}; do
            if curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --max-redirs 0 -fsS \
                --dump-header installer-headers.txt \
                https://ravenstash.com/install.sh \
                --output live-install.sh \
              && cmp "$EXPECTED_INSTALLER" live-install.sh \
              && bash -n live-install.sh \
              && grep -Eiq '^content-type: text/plain([;[:space:]]|$)' installer-headers.txt \
              && grep -Eiq '^cache-control: no-store' installer-headers.txt \
              && grep -Eiq '^strict-transport-security: max-age=31536000; includeSubDomains' installer-headers.txt \
              && grep -Eiq '^x-content-type-options: nosniff' installer-headers.txt; then
              exit 0
            fi
            if [[ "$attempt" -lt 60 ]]; then
              sleep 5
            fi
          done
          echo "::error::Live installer did not converge to the promoted bytes and headers"
          exit 1
