name: release-candidate
run-name: Candidate rvs v${{ inputs.version }} · ${{ inputs.channel }} · ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA from the dev branch
        type: string
        required: true
      version:
        description: Exact semantic version without v prefix
        type: string
        required: true
      channel:
        description: Exact compatibility channel (v0.Y before 1.0, vMAJOR afterwards)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rvs-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source, version, and channel
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "$GITHUB_REF" = refs/heads/dev
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([~+.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/dev
          python3 packaging/repository/channel_policy.py validate "$VERSION" "$CHANNEL"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)" = "$VERSION"
          grep -Fx "readonly release_version=\"${VERSION}\"" packaging/install.sh
          grep -Fx "readonly compatibility_channel=\"${CHANNEL}\"" packaging/install.sh
          grep -Fx "\$ReleaseVersion = \"${VERSION}\"" packaging/install.ps1
          grep -Fx "\$CompatibilityChannel = \"${CHANNEL}\"" packaging/install.ps1
          test -z "$(git status --porcelain)"

  linux-glibc-amd64:
    name: Build · Linux glibc · amd64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-glibc-amd64
      runner: ubuntu-24.04
      kind: glibc
      architecture: amd64
      include_metadata: true
      artifact_paths: |
        dist/release/rvs_${{ inputs.version }}_amd64.deb
        dist/release/rvs-v${{ inputs.version }}-linux-amd64.tar.gz

  linux-glibc-arm64:
    name: Build · Linux glibc · arm64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-glibc-arm64
      runner: ubuntu-24.04-arm
      kind: glibc
      architecture: arm64
      artifact_paths: |
        dist/release/rvs_${{ inputs.version }}_arm64.deb
        dist/release/rvs-v${{ inputs.version }}-linux-arm64.tar.gz

  linux-musl-amd64:
    name: Build · Linux musl · amd64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-musl-amd64
      runner: ubuntu-24.04
      kind: musl
      architecture: amd64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-linux-musl-amd64.tar.gz

  linux-musl-arm64:
    name: Build · Linux musl · arm64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: linux-musl-arm64
      runner: ubuntu-24.04-arm
      kind: musl
      architecture: arm64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-linux-musl-arm64.tar.gz

  macos-arm64:
    name: Build · macOS · Apple Silicon
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: macos-arm64
      runner: macos-14
      kind: portable
      architecture: arm64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-macos-arm64.tar.gz

  macos-amd64:
    name: Build · macOS · Intel
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: macos-amd64
      runner: macos-15-intel
      kind: portable
      architecture: amd64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-macos-amd64.tar.gz

  windows-amd64:
    name: Build · Windows · x64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: windows-amd64
      runner: windows-2022
      kind: portable
      architecture: amd64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-windows-amd64.zip

  windows-arm64:
    name: Build · Windows · ARM64
    needs: validate
    uses: ./.github/workflows/_build-release-target.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      target: windows-arm64
      runner: windows-11-arm
      kind: portable
      architecture: arm64
      artifact_paths: dist/release/rvs-v${{ inputs.version }}-windows-arm64.zip

  assemble:
    name: Assemble and attest candidate
    needs:
      - linux-glibc-amd64
      - linux-glibc-arm64
      - linux-musl-amd64
      - linux-musl-arm64
      - macos-arm64
      - macos-amd64
      - windows-amd64
      - windows-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download isolated target handoffs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rvs-target-*-${{ inputs.source_sha }}
          path: build/targets
      - name: Install pinned Sigstore signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Assemble a collision-free release inventory
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          install -d build/release
          expected=(
            "rvs_${VERSION}_amd64.deb"
            "rvs_${VERSION}_arm64.deb"
            "rvs-v${VERSION}-linux-amd64.tar.gz"
            "rvs-v${VERSION}-linux-arm64.tar.gz"
            "rvs-v${VERSION}-linux-musl-amd64.tar.gz"
            "rvs-v${VERSION}-linux-musl-arm64.tar.gz"
            "rvs-v${VERSION}-macos-amd64.tar.gz"
            "rvs-v${VERSION}-macos-arm64.tar.gz"
            "rvs-v${VERSION}-windows-amd64.zip"
            "rvs-v${VERSION}-windows-arm64.zip"
            "rvs-v${VERSION}-sbom.cdx.json"
          )
          for filename in "${expected[@]}"; do
            mapfile -t matches < <(find build/targets -type f -name "$filename" -print)
            test "${#matches[@]}" = 1
            install -m 0644 "${matches[0]}" "build/release/$filename"
          done
          install -m 0755 packaging/install.sh build/release/install.sh
          install -m 0644 packaging/install.ps1 build/release/install.ps1
          python3 packaging/scripts/generate_package_manifests.py \
            build/release "$VERSION" "$GITHUB_REPOSITORY"
          printf '%s\n' \
            "source_repository=${GITHUB_REPOSITORY}" \
            "source_sha=${SOURCE_SHA}" \
            "version=${VERSION}" \
            "channel=${CHANNEL}" \
            "candidate_run_id=${GITHUB_RUN_ID}" \
            "candidate_workflow=.github/workflows/release-candidate.yml" \
            > build/release/source-identity.txt
          (
            cd build/release
            find . -maxdepth 1 -type f ! -name '*-checksums.txt' ! -name '*.sigstore.json' \
              -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > "rvs-v${VERSION}-checksums.txt"
          )
          cosign sign-blob --yes \
            --bundle "build/release/rvs-v${VERSION}-checksums.sigstore.json" \
            "build/release/rvs-v${VERSION}-checksums.txt"
      - name: Summarize immutable candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Release candidate"
            echo
            echo "- Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Source: \`${{ inputs.source_sha }}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Channel: \`${{ inputs.channel }}\`"
            echo
            echo '```text'
            sed 's/^/  /' "build/release/rvs-v${VERSION}-checksums.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rvs-candidate-${{ inputs.source_sha }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  cleanup-target-handoffs:
    name: Remove assembled target handoffs
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete only target-specific artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"rvs-target-\") and endswith(\"-${SOURCE_SHA}\")) | .id" \
            | while read -r artifact_id; do
                gh api --method DELETE \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
