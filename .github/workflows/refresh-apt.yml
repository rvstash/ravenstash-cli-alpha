name: refresh-apt-metadata

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvs-release
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    environment: apt-storage
    steps:
      - name: Check out release policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install restore verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version
      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Restore and authenticate APT state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          mkdir prior
          aws s3 sync \
            "s3://ravenstash-cli-releases/rvs/apt/" prior/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          python3 packaging/repository/verify_apt.py \
            prior packaging/repository/keys/ravenstash-rvs.gpg
      - name: Upload authenticated state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refresh-authenticated-apt
          path: prior/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    needs: restore
    runs-on: ubuntu-24.04
    environment: apt-signing
    steps:
      - name: Check out signing policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev gnupg gpgv
      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Download authenticated state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: refresh-authenticated-apt
          path: prior
      - name: Re-verify before exposing signer
        run: >-
          python3 packaging/repository/verify_apt.py
          prior packaging/repository/keys/ravenstash-rvs.gpg
      - name: Refresh and sign metadata
        env:
          RVS_APT_GPG_PRIVATE_KEY: ${{ secrets.RVS_APT_GPG_PRIVATE_KEY }}
          RVS_APT_GPG_PASSPHRASE: ${{ secrets.RVS_APT_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/rvs-apt-signing"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$RVS_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test -n "$key_id"
          passphrase_file="$RUNNER_TEMP/rvs-apt-passphrase"
          printf '%s' "$RVS_APT_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 0600 "$passphrase_file"
          package="$(
            find prior/pool/main/r/rvs -maxdepth 1 -type f -name 'rvs_*_amd64_*.deb' \
              | sort -V \
              | tail -n 1
          )"
          test -n "$package"
          version="$(dpkg-deb --field "$package" Version)"
          channel="$(python3 packaging/repository/channel_policy.py channel-for-version "$version")"
          RVS_APT_GPG_KEY_ID="$key_id" \
          RVS_APT_GPG_FINGERPRINT="$(tr -d '[:space:]' < packaging/repository/keys/fingerprint.txt)" \
          RVS_APT_GPG_PASSPHRASE_FILE="$passphrase_file" \
          RVS_APT_CHANNEL="$channel" \
          RVS_APT_PROMOTE_CHANNEL=0 \
            packaging/repository/append_and_sign_apt.sh \
              prior "$package" signed packaging/repository/keys/ravenstash-rvs.gpg
          rm -f "$passphrase_file"
          rm -rf "$GNUPGHOME"
      - name: Upload refreshed signed state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refresh-signed-apt
          path: signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    environment: apt-storage
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out publication policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install publication verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev gnupg gpgv
          aws --version
      - name: Materialize and pin trusted keyring
        run: packaging/repository/prepare_keyring.sh
      - name: Download refreshed signed state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: refresh-signed-apt
          path: signed
      - name: Authenticate signed handoff
        run: >-
          python3 packaging/repository/verify_apt.py
          signed packaging/repository/keys/ravenstash-rvs.gpg
      - name: Publish with InRelease last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_APT_ACCOUNT_ID }}
        run: |
          packaging/repository/publish_apt.sh \
            signed \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            ravenstash-cli-releases
      - name: Delete temporary handoff artifacts after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
