[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rvn"
version = "0.1.0"
description = "Universal package manager CLI for RavenStash private registries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "tomli-w>=1.0",
    "keyring>=25.0",
]

[project.scripts]
rvn = "rvn.cli:app"
rvnx = "rvn.rvnx:entry_point"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rvn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["rvn"]
include = ["**/*.py"]
exclude = [".venv", "__pycache__", "*.egg-info"]
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (modern Python syntax)
    "N",    # pep8-naming
    "RUF",  # Ruff-specific rules
    "TC",   # flake8-type-checking
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function-call in default args (common in typer)
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = false

[tool.ruff.lint.isort]
split-on-trailing-comma = true
lines-after-imports = 2

# ── Pyright ───────────────────────────────────────────────────────────────────

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["rvn"]
exclude = [".venv", "*.egg-info"]
typeCheckingMode = "basic"
