[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ravenstash-cli"
version = "0.5.0"
description = "Ravenstash developer CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "tomli-w>=1.0",
    "keyring>=25.0",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://ravenstash.com"
Repository = "https://github.com/rvstash/ravenstash-cli-alpha"
Issues = "https://github.com/rvstash/ravenstash-cli-alpha/issues"

[project.scripts]
rvs = "rvs.cli:app"
ravenstash = "rvs.cli:app"
docker-credential-rvs = "rvs.oci.credential_helper:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
release = [
    "cyclonedx-bom==7.3.1",
    "pyinstaller==6.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rvs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["rvs"]
include = ["**/*.py"]
exclude = [".venv", "__pycache__", "*.egg-info"]
show-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (modern Python syntax)
    "N",    # pep8-naming
    "RUF",  # Ruff-specific rules
    "TC",   # flake8-type-checking
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function-call in default args (common in typer)
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = false

[tool.ruff.lint.isort]
split-on-trailing-comma = true
lines-after-imports = 2

# ── Pyright ───────────────────────────────────────────────────────────────────

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["rvs"]
exclude = [".venv", "*.egg-info"]
typeCheckingMode = "basic"
